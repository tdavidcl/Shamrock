name: Ensure orphan branch
description: Create a named orphan branch if it does not already exist.
author: Shamrock-code

branding:
  icon: git-branch
  color: green

inputs:
  branch_name:
    description: Name of the orphan branch to ensure exists.
    required: false
    default: orphan-branch

outputs:
  exists:
    description: Whether the branch already existed.
    value: ${{ steps.check_branch.outputs.exists }}

runs:
  using: composite
  steps:
    - name: Check if branch exists
      id: check_branch
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
      run: |
        if git ls-remote --heads origin "$BRANCH_NAME" | grep "$BRANCH_NAME"; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Create orphan branch if missing
      if: steps.check_branch.outputs.exists == 'false'
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout --orphan "$BRANCH_NAME"
        git rm -rf .
        echo "# $BRANCH_NAME" > README.md
        git add README.md
        git commit -m "Initial commit on orphan branch"
        git push origin "$BRANCH_NAME"
