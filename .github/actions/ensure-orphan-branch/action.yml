name: Ensure orphan branch
description: Create a named orphan branch if it does not already exist on the repository.
author: Shamrock-code

branding:
  icon: git-branch
  color: green

inputs:
  branch_name:
    description: Name of the orphan branch to ensure exists.
    required: false
    default: orphan-branch
  github_token:
    description: Token used to query and push the branch. Defaults to the workflow GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  repository:
    description: Target repository in owner/name form. Defaults to the current repository.
    required: false
    default: ${{ github.repository }}
  commit_message:
    description: Commit message used when creating the orphan branch.
    required: false
    default: Initial commit on orphan branch
  git_user_name:
    description: Git author/committer name used for the initial orphan commit.
    required: false
    default: github-actions[bot]
  git_user_email:
    description: Git author/committer email used for the initial orphan commit.
    required: false
    default: 41898282+github-actions[bot]@users.noreply.github.com

outputs:
  branch_name:
    description: Branch that was checked or created.
    value: ${{ steps.ensure.outputs.branch_name }}
  exists:
    description: Whether the branch already existed before this run (`true` or `false`).
    value: ${{ steps.ensure.outputs.exists }}
  created:
    description: Whether this run created the branch (`true` or `false`).
    value: ${{ steps.ensure.outputs.created }}

runs:
  using: composite
  steps:
    - name: Ensure orphan branch
      id: ensure
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPOSITORY: ${{ inputs.repository }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
        GIT_USER_NAME: ${{ inputs.git_user_name }}
        GIT_USER_EMAIL: ${{ inputs.git_user_email }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
      run: bash "${GITHUB_ACTION_PATH}/ensure-orphan-branch.sh"
