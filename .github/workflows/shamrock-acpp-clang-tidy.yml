name: Acpp/clang (Clang-tidy)


on:
  workflow_call:
    inputs:
      run_full:
        description: Run full clang-tidy and upload HTML report.
        required: false
        default: true
        type: boolean
      run_diff:
        description: Run clang-tidy-diff on PR changes and upload report.
        required: false
        default: true
        type: boolean

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      run_full:
        description: Run full clang-tidy and upload HTML report.
        required: false
        default: true
        type: boolean
      run_diff:
        description: Run clang-tidy-diff on PR changes and upload report.
        required: false
        default: true
        type: boolean


jobs:

  shamrock_acpp_omp_tidy:
    name: AdaptiveCpp omp tidy clang-${{ matrix.clang }}
    if: inputs.run_full || inputs.run_diff
    runs-on: ${{ inputs.run_full && fromJSON('["self-hosted", "docker-runner"]') || 'ubuntu-latest' }}

    container:
      image: ${{ matrix.container }}


    strategy:
      matrix:
        include:
          - clang: 20
            container: ghcr.io/shamrock-code/shamrock-ci:ubuntu24
    #if: false

    timeout-minutes: 120
    steps:
      #### Checkout part ####
      # Checkout merge commit if PR otherwise default
      - name : Reconfigure git
        run:  |
          git config --global --add safe.directory '*'
          git config --global --list
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request_target'
        with:
          fetch-depth: 0
          submodules: recursive
          ref: "refs/pull/${{ github.event.number }}/merge"

      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request_target'
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Show diff against main
        if: github.event_name == 'pull_request_target'
        run: git diff ${{ github.event.pull_request.base.sha }} HEAD
      #### End Checkout part ####

      - name: ls local
        run : ls -la

      - name: install LLVM
        run: |
          echo "APT::Acquire::Retries \"10\";" | sudo tee -a /etc/apt/apt.conf.d/80-retries
          sudo apt update && \
          ./tools/apt_install_llvm.sh ${{matrix.clang}}

      - name: Install clang-tidy
        run: |
          sudo apt install clang-tidy-${{matrix.clang}}

      - name: Check clang-tidy configuration
        run: |
          ./buildbot/check_clang_tidy_cfg.sh clang-tidy-${{matrix.clang}}

      - run: git config --unset-all http.https://github.com/.extraheader

      - name: Diagnose git credential issue
        shell: bash
        run: |
          echo "=== GIT/CREDENTIAL DIAGNOSTICS ==="
          echo "--- git version ---"
          git --version

          echo "--- effective config (all scopes) ---"
          git config --list --show-origin

          echo "--- credential.* config specifically ---"
          git config --global --get-all credential.helper || true
          git config --system --get-all credential.helper || true
          env | grep -i GIT_ || true

          echo "--- relevant env vars ---"
          echo "HOME=$HOME"
          echo "GIT_TERMINAL_PROMPT=$GIT_TERMINAL_PROMPT"
          echo "GIT_ASKPASS=$GIT_ASKPASS"
          echo "SSH_ASKPASS=$SSH_ASKPASS"
          echo "DISPLAY=$DISPLAY"
          id

          echo "--- .netrc / .git-credentials presence ---"
          ls -la "$HOME/.netrc" "$HOME/.git-credentials" 2>&1 || true

          echo "--- test raw connectivity to github.com (no auth) ---"
          curl -v https://github.com/AdaptiveCpp/AdaptiveCpp.git/info/refs?service=git-upload-pack 2>&1 | head -40

          echo "--- force no-prompt to see the real underlying error ---"
          GIT_TERMINAL_PROMPT=0 GIT_CURL_VERBOSE=1 GIT_TRACE=1 \
            git clone -b v25.02.0 https://github.com/AdaptiveCpp/AdaptiveCpp.git /tmp/acpp-diag-test 2>&1 | tail -60

          echo "=== END DIAGNOSTICS ==="

      - name: Build acpp (offending clone)
        shell: bash
        run: |
          git clone -b v25.02.0 https://github.com/AdaptiveCpp/AdaptiveCpp.git /__w/Shamrock/Shamrock/build/.env/acpp-git

      - name: configure Shamrock
        run: |
          ./env/new-env --machine debian-generic.acpp --builddir build -- --backend omp

      - name: Configure
        shell: bash # In docker container github action default to sh
        # we need to run shamconfigure twice because compile_commands is not generated otherwise
        # with this docker image, i never saw this behavior before
        run: |
          cd build
          source ./activate && shamconfigure && shamconfigure

      - name: Generate version file
        run: |
          cd build
          ninja src/shamrock/version.cpp

      - name: Copy DB
        run: |
          cd build
          python3 ../buildbot/make_clang_tidy_db.py

      - name: Run clang-tidy
        if: inputs.run_full
        run: |
          export CLANGTIDYBINARY=clang-tidy-${{matrix.clang}}
          run-clang-tidy-${{matrix.clang}} \
            -clang-tidy-binary ./buildbot/clang-tidy-wrapper.sh \
            -p build/clang-tidy.mod \
            -use-color \
            -config-file .clang-tidy \
            -extra-arg-before="-Wno-unused-command-line-argument" \
            | tee clang-tidy.log

      - name: Convert clang-tidy log to HTML with Monokai theme
        if: inputs.run_full
        run: |
          python3 -m pip install --break-system-packages ansi2html

          # Convert ANSI log to HTML using the Monokai palette
          ansi2html < clang-tidy.log > clang-tidy.html

          sed -i \
              \
              -e 's/color: #AAAAAA;/color: #f8f8f2;/g' \
              -e 's/color: #000000;/color: #272822;/g' \
              \
              -e 's/background-color: #000000;/background-color: #272822;/g' \
              -e 's/background-color: #AAAAAA;/background-color: #f8f8f2;/g' \
              \
              -e 's/color: #272822;/color: #272822;/g' \
              -e 's/color: #f92672;/color: #f92672;/g' \
              -e 's/color: #00aa00;/color: #a6e22e;/g' \
              -e 's/color: #f4bf75;/color: #f4bf75;/g' \
              -e 's/color: #66d9ef;/color: #66d9ef;/g' \
              -e 's/color: #E850A8;/color: #ae81ff;/g' \
              -e 's/color: #00aaaa;/color: #a1efe4;/g' \
              -e 's/color: #AAAAAA;/color: #f8f8f2;/g' \
              \
              clang-tidy.html


      - uses: actions/upload-artifact@v4
        if: inputs.run_full
        with:
          name: clang-tidy.html
          path: ./clang-tidy.html

      - name: Run clang-tidy-diff
        if: >
          inputs.run_diff &&
          (github.event_name == 'pull_request_target' ||
            github.event_name == 'pull_request')
        run: git diff ${{ github.event.pull_request.base.sha }} HEAD |
          clang-tidy-diff-${{matrix.clang}}.py -j $(nproc) -clang-tidy-binary clang-tidy-${{matrix.clang}} -path build/clang-tidy.mod -p1 -config-file .clang-tidy -extra-arg-before="-Wno-unused-command-line-argument" -fix 2>&1 | tee clang-tidy-output.txt

      - name : Generate diff
        if: >
          inputs.run_diff &&
          (github.event_name == 'pull_request_target' ||
            github.event_name == 'pull_request')
        run: git diff > diff-clang-tidy && cat diff-clang-tidy

      - name: Print clang-tidy output
        if: >
          inputs.run_diff &&
          (github.event_name == 'pull_request_target' ||
            github.event_name == 'pull_request')
        run: |
          python3 buildbot/clang_tidy_diff_report.py -i clang-tidy-output.txt -f diff-clang-tidy -o report_clang_tidy.md

      - uses: actions/upload-artifact@v4
        if: >
          inputs.run_diff &&
          (github.event_name == 'pull_request_target' ||
            github.event_name == 'pull_request')
        with:
          name: report_clang_tidy
          path: ./report_clang_tidy.md
