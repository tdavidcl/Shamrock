<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="450" viewBox="0 0 1060 450" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8aa0"/>
    </marker>
    <g id="eval"><circle r="9" fill="#2563eb"/></g>
    <g id="reuse"><circle r="9" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 2.5"/></g>
    <g id="skip"><circle r="9" fill="#f1f3f6" stroke="#9aa3b2" stroke-width="1.5"/><path d="M-5,-5 L5,5 M5,-5 L-5,5" stroke="#9aa3b2" stroke-width="1.8"/></g>
    <g id="never"><circle r="5" fill="none" stroke="#c3c9d4" stroke-width="1.5"/></g>
  </defs>

  <rect width="1060" height="450" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="34" font-size="19" font-weight="600" fill="#111827">Column kernel integral Y_3d: z samples per version (np = 4, Δz = R/4)</text>
  <text x="20" y="56" font-size="13" fill="#4b5563">Y_3d(r, h) ∝ Σ f(√(x² + z²)) · Δz over z ∈ [−R, R), x = r/h. Both versions use the same 8-point grid; only the number of kernel evaluations changes.</text>

  <!-- Legend -->
  <g transform="translate(20,88)" font-size="12.5" fill="#374151">
    <use href="#eval" x="9" y="0"/><text x="26" y="4">f evaluated</text>
    <use href="#reuse" x="129" y="0"/><text x="146" y="4">reused from mirror point (f even in z)</text>
    <use href="#skip" x="409" y="0"/><text x="426" y="4">not computed (f = 0 at z = −R)</text>
    <use href="#never" x="649" y="0"/><text x="662" y="4">z = R (not part of the sum)</text>
  </g>

  <!-- column headers -->
  <text x="20" y="128" font-size="11.5" fill="#6b7280" letter-spacing="0.5">VERSION</text>
  <text x="240" y="128" font-size="11.5" fill="#6b7280" letter-spacing="0.5">SAMPLE POINTS ALONG z</text>
  <text x="760" y="128" font-size="11.5" fill="#6b7280" letter-spacing="0.5">COST, RESULT, RTX 3070 MEDIAN TIME</text>
  <line x1="20" y1="136" x2="1040" y2="136" stroke="#e5e7eb"/>

  <!-- ================= Row 1: main ================= -->
  <g>
    <text x="20" y="196" font-size="15" font-weight="600" fill="#111827">main (before)</text>
    <text x="20" y="216" font-size="12.5" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">048835278</text>

    <line x1="225" y1="225" x2="695" y2="225" stroke="#9ca3af" stroke-width="1.2"/>
    <use href="#eval" x="240" y="225"/>
    <use href="#eval" x="295" y="225"/>
    <use href="#eval" x="350" y="225"/>
    <use href="#eval" x="405" y="225"/>
    <use href="#eval" x="460" y="225"/>
    <use href="#eval" x="515" y="225"/>
    <use href="#eval" x="570" y="225"/>
    <use href="#eval" x="625" y="225"/>
    <use href="#never" x="680" y="225"/>
    <text x="240" y="205" font-size="11" fill="#6b7280" text-anchor="middle">= 0</text>

    <g font-size="11.5" fill="#4b5563" text-anchor="middle">
      <text x="240" y="250">−R</text><text x="295" y="250">−¾R</text><text x="350" y="250">−½R</text><text x="405" y="250">−¼R</text><text x="460" y="250">0</text><text x="515" y="250">¼R</text><text x="570" y="250">½R</text><text x="625" y="250">¾R</text><text x="680" y="250">R</text>
    </g>
    <text x="240" y="272" font-size="12" fill="#374151">Σ<tspan font-size="9" dy="3">k=−4..3</tspan><tspan dy="-3"> f(√(x²+z</tspan><tspan font-size="9" dy="3">k</tspan><tspan dy="-3">²)) · Δz  — plain Riemann loop, z += Δz</tspan></text>

    <g font-size="12.5" fill="#374151">
      <text x="760" y="196"><tspan font-weight="600" fill="#111827">8</tspan> kernel evaluations per call</text>
      <text x="760" y="216">result: reference</text>
      <text x="760" y="236">cartesian column ρ: <tspan font-weight="600">0.589 s</tspan></text>
      <text x="760" y="256">azimuthal ρ: <tspan font-weight="600">10.08 s</tspan></text>
    </g>
  </g>

  <line x1="20" y1="290" x2="1040" y2="290" stroke="#e5e7eb"/>

  <!-- ================= Row 2: after ================= -->
  <g transform="translate(0,-170)">
    <text x="20" y="536" font-size="15" font-weight="600" fill="#111827">after (symmetric sum)</text>

    <line x1="225" y1="565" x2="695" y2="565" stroke="#9ca3af" stroke-width="1.2"/>
    <!-- mirror arcs: positive side -> negative side -->
    <g fill="none" stroke="#7c8aa0" stroke-width="1.4" marker-end="url(#arr)">
      <path d="M515,554 Q460,504 405,554"/>
      <path d="M570,554 Q460,479 350,554"/>
      <path d="M625,554 Q460,454 295,554"/>
    </g>
    <use href="#skip" x="240" y="565"/>
    <use href="#reuse" x="295" y="565"/>
    <use href="#reuse" x="350" y="565"/>
    <use href="#reuse" x="405" y="565"/>
    <use href="#eval" x="460" y="565"/>
    <use href="#eval" x="515" y="565"/>
    <use href="#eval" x="570" y="565"/>
    <use href="#eval" x="625" y="565"/>
    <use href="#never" x="680" y="565"/>
    <text x="240" y="545" font-size="11" fill="#6b7280" text-anchor="middle">= 0</text>

    <g font-size="11.5" fill="#4b5563" text-anchor="middle">
      <text x="240" y="590">−R</text><text x="295" y="590">−¾R</text><text x="350" y="590">−½R</text><text x="405" y="590">−¼R</text><text x="460" y="590">0</text><text x="515" y="590">¼R</text><text x="570" y="590">½R</text><text x="625" y="590">¾R</text><text x="680" y="590">R</text>
    </g>
    <text x="240" y="612" font-size="12" fill="#374151">Δz · [ f(|x|) + 2 · Σ<tspan font-size="9" dy="3">k=1..3</tspan><tspan dy="-3"> f(√(x² + z</tspan><tspan font-size="9" dy="3">k</tspan><tspan dy="-3">²)) ]  — sum reordered, Δz factored out</tspan></text>

    <g font-size="12.5" fill="#374151">
      <text x="760" y="536"><tspan font-weight="600" fill="#111827">4</tspan> kernel evaluations per call</text>
      <text x="760" y="556">result: matches main to a few ulp (≤ 7e-15)</text>
      <text x="760" y="576">cartesian column ρ: <tspan font-weight="600">0.375 s</tspan> <tspan fill="#6b7280">(1.57× vs main)</tspan></text>
      <text x="760" y="596">azimuthal ρ: <tspan font-weight="600">7.25 s</tspan> <tspan fill="#6b7280">(1.39× vs main)</tspan></text>
    </g>
  </g>
</svg>
