<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Build time</title>
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.3/plotly.min.js"></script>
    <style>
      :root {
        --bg: #fff;
        --fg: #3c3836;
        --muted: #665c54;
        --grid: #d5c4a1;
      }

      html[data-theme="dark"] {
        --bg: #282828;
        --fg: #ebdbb2;
        --muted: #a89984;
        --grid: #504945;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }

      #chart {
        width: 100%;
        height: 100%;
      }

      #anno-overlay {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: visible;
        z-index: 1;
      }

      #status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        text-align: center;
        color: var(--muted);
      }

      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading build time history…</div>
    <div id="chart"></div>
    <svg id="anno-overlay" aria-hidden="true"></svg>
    <script>
      const DATA_URLS = [
        "https://raw.githubusercontent.com/Shamrock-code/Shamrock/refs/heads/metrics-history/output/build_time_total.json",
        "https://cdn.jsdelivr.net/gh/Shamrock-code/Shamrock@metrics-history/output/build_time_total.json",
      ];
      const SECONDS_PER_HOUR = 3600;

      // Matplotlib-style annotate() callouts. Offsets and connectionstyle match:
      //   ax.annotate(text, xy=(...), xycoords='data',
      //               xytext=(-90, 50), textcoords='offset points',
      //               arrowprops=dict(arrowstyle="->",
      //                               connectionstyle="arc,angleA=0,armA=50,rad=10"))
      const CURVED_ANNOTATIONS = [
        {
          date: "2026-08-17",
          text: "force -j 4 in gh-runners",
          series: "total_h",
          xytext: [-90, 50],
          connectionstyle: { angleA: 0, armA: 50, rad: 10 },
        },
      ];

      function lastIndexOnDate(dates, datePrefix) {
        let found = -1;
        for (let i = 0; i < dates.length; i++) {
          if (String(dates[i]).startsWith(datePrefix)) {
            found = i;
          }
        }
        return found;
      }

      function axisNumeric(axis, value) {
        let converted = axis.d2c(value);
        if (!Number.isFinite(converted) && axis.type === "date") {
          const ms = Date.parse(value);
          if (Number.isFinite(ms)) {
            converted = axis.d2c(ms);
          }
        }
        return converted;
      }

      function rangeNumeric(value) {
        if (typeof value === "number" && Number.isFinite(value)) {
          return value;
        }
        const ms = Date.parse(value);
        return Number.isFinite(ms) ? ms : Number(value);
      }

      function dataToPixel(gd, x, y) {
        const xaxis = gd._fullLayout && gd._fullLayout.xaxis;
        const yaxis = gd._fullLayout && gd._fullLayout.yaxis;
        if (!xaxis || !yaxis || typeof xaxis.d2c !== "function" || typeof yaxis.d2c !== "function") {
          return null;
        }
        const xc = axisNumeric(xaxis, x);
        const yc = axisNumeric(yaxis, y);
        if (!Number.isFinite(xc) || !Number.isFinite(yc)) {
          return null;
        }
        const xp = xaxis.l2p(xc);
        const yp = yaxis.l2p(yc);
        if (!Number.isFinite(xp) || !Number.isFinite(yp)) {
          return null;
        }
        return { x: xaxis._offset + xp, y: yaxis._offset + yp };
      }

      function inAxisRange(gd, x, y) {
        const xaxis = gd._fullLayout.xaxis;
        const yaxis = gd._fullLayout.yaxis;
        const xc = axisNumeric(xaxis, x);
        const yc = axisNumeric(yaxis, y);
        const xr = xaxis.range;
        const yr = yaxis.range;
        if (!xr || !yr) {
          return true;
        }
        const xmin = Math.min(rangeNumeric(xr[0]), rangeNumeric(xr[1]));
        const xmax = Math.max(rangeNumeric(xr[0]), rangeNumeric(xr[1]));
        const ymin = Math.min(rangeNumeric(yr[0]), rangeNumeric(yr[1]));
        const ymax = Math.max(rangeNumeric(yr[0]), rangeNumeric(yr[1]));
        return xc >= xmin && xc <= xmax && yc >= ymin && yc <= ymax;
      }

      // Port of matplotlib.patches.ConnectionStyle.Arc.connect (y-up angles).
      function matplotlibArcPath(posA, posB, style) {
        const angleA = style.angleA || 0;
        const angleB = style.angleB || 0;
        const armA = style.armA;
        const armB = style.armB;
        const rad = style.rad || 0;
        const deg = Math.PI / 180;
        const cosA = Math.cos(angleA * deg);
        const sinA = -Math.sin(angleA * deg);
        const cosB = Math.cos(angleB * deg);
        const sinB = -Math.sin(angleB * deg);
        const x1 = posA.x;
        const y1 = posA.y;
        const x2 = posB.x;
        const y2 = posB.y;

        const vertices = [{ x: x1, y: y1 }];
        const codes = ["M"];
        let rounded = [];

        if (armA) {
          rounded.push({ x: x1 + (armA - rad) * cosA, y: y1 + (armA - rad) * sinA });
          rounded.push({ x: x1 + armA * cosA, y: y1 + armA * sinA });
        }

        if (armB) {
          const xArmB = x2 + armB * cosB;
          const yArmB = y2 + armB * sinB;
          if (rounded.length) {
            const last = rounded[rounded.length - 1];
            const dx = xArmB - last.x;
            const dy = yArmB - last.y;
            const dd = Math.hypot(dx, dy) || 1;
            rounded.push({ x: last.x + (rad * dx) / dd, y: last.y + (rad * dy) / dd });
            vertices.push(...rounded);
            codes.push("L", "Q", "Q");
            rounded = [];
          } else {
            const last = vertices[vertices.length - 1];
            const dx = xArmB - last.x;
            const dy = yArmB - last.y;
            const dd = Math.hypot(dx, dy) || 1;
            rounded = [
              { x: last.x + ((dd - rad) * dx) / dd, y: last.y + ((dd - rad) * dy) / dd },
              { x: xArmB, y: yArmB },
            ];
          }
        }

        if (rounded.length) {
          const last = rounded[rounded.length - 1];
          const dx = x2 - last.x;
          const dy = y2 - last.y;
          const dd = Math.hypot(dx, dy) || 1;
          rounded.push({ x: last.x + (rad * dx) / dd, y: last.y + (rad * dy) / dd });
          vertices.push(...rounded);
          codes.push("L", "Q", "Q");
        }

        vertices.push({ x: x2, y: y2 });
        codes.push("L");

        const parts = [];
        for (let i = 0; i < vertices.length; i++) {
          const code = codes[i];
          const p = vertices[i];
          if (code === "M") {
            parts.push(`M ${p.x} ${p.y}`);
          } else if (code === "L") {
            parts.push(`L ${p.x} ${p.y}`);
          } else if (code === "Q") {
            const end = vertices[i + 1];
            parts.push(`Q ${p.x} ${p.y} ${end.x} ${end.y}`);
            i += 1;
          }
        }
        return { d: parts.join(" "), vertices };
      }

      function arrowHeadPoints(fromPt, toPt, size) {
        const dx = toPt.x - fromPt.x;
        const dy = toPt.y - fromPt.y;
        const angle = Math.atan2(dy, dx);
        const spread = Math.PI * 0.82;
        return [
          toPt,
          {
            x: toPt.x - size * Math.cos(angle - spread),
            y: toPt.y - size * Math.sin(angle - spread),
          },
          {
            x: toPt.x - size * Math.cos(angle + spread),
            y: toPt.y - size * Math.sin(angle + spread),
          },
        ];
      }

      function svgEl(name, attrs) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", name);
        Object.keys(attrs).forEach((key) => {
          el.setAttribute(key, attrs[key]);
        });
        return el;
      }

      function drawCurvedAnnotations(gd, series) {
        const overlay = document.getElementById("anno-overlay");
        while (overlay.firstChild) {
          overlay.removeChild(overlay.firstChild);
        }
        if (!gd || !gd._fullLayout) {
          return;
        }
        overlay.setAttribute("width", String(gd._fullLayout.width));
        overlay.setAttribute("height", String(gd._fullLayout.height));
        overlay.style.width = `${gd._fullLayout.width}px`;
        overlay.style.height = `${gd._fullLayout.height}px`;

        const styles = getComputedStyle(document.documentElement);
        const color = styles.getPropertyValue("--fg").trim() || "#3c3836";
        const bg = styles.getPropertyValue("--bg").trim() || "#fff";

        CURVED_ANNOTATIONS.forEach((anno) => {
          const idx = lastIndexOnDate(series.x, anno.date);
          if (idx < 0) {
            return;
          }
          const yValues = series[anno.series];
          if (!yValues || typeof yValues[idx] !== "number") {
            return;
          }
          const x = series.x[idx];
          const y = yValues[idx];
          if (!inAxisRange(gd, x, y)) {
            return;
          }
          const xy = dataToPixel(gd, x, y);
          if (!xy) {
            return;
          }
          const posB = xy;
          const posA = { x: posB.x + anno.xytext[0], y: posB.y - anno.xytext[1] };
          const path = matplotlibArcPath(posA, posB, anno.connectionstyle);
          const verts = path.vertices;
          const fromPt = verts.length >= 2 ? verts[verts.length - 2] : posA;
          const head = arrowHeadPoints(fromPt, posB, 8);
          const g = svgEl("g", { fill: color, stroke: color });
          g.appendChild(
            svgEl("path", {
              d: path.d,
              fill: "none",
              "stroke-width": "1.25",
              "stroke-linecap": "round",
              "stroke-linejoin": "round",
            })
          );
          g.appendChild(
            svgEl("polygon", {
              points: head.map((p) => `${p.x},${p.y}`).join(" "),
              stroke: "none",
            })
          );
          const text = svgEl("text", {
            x: String(posA.x - 6),
            y: String(posA.y),
            "text-anchor": "end",
            "dominant-baseline": "middle",
            "font-family": "system-ui, sans-serif",
            "font-size": "13",
            fill: color,
            stroke: bg,
            "stroke-width": "4",
            "paint-order": "stroke",
          });
          text.textContent = anno.text;
          g.appendChild(text);
          overlay.appendChild(g);
        });
      }

      function parentTheme() {
        try {
          if (window.parent && window.parent !== window) {
            const theme = window.parent.document.documentElement.getAttribute("data-theme");
            if (theme === "dark" || theme === "light") {
              return theme;
            }
          }
        } catch (err) {
          /* Cross-origin parent: fall back to prefers-color-scheme. */
        }
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
      }

      function seriesColors(theme) {
        const dark = theme === "dark";
        return {
          parsing: dark ? "#83a598" : "#076678",
          codegen: dark ? "#fe8019" : "#af3a03",
          total: dark ? "#b8bb26" : "#79740e",
          tus: dark ? "#d3869b" : "#8f3f71",
        };
      }

      function hasTranslationUnits(series) {
        return series.translation_unit_count.some((value) => value !== null);
      }

      function paddedRange(values, integer) {
        const nums = values.filter((value) => typeof value === "number" && Number.isFinite(value));
        if (nums.length === 0) {
          return undefined;
        }
        const min = Math.min(...nums);
        const max = Math.max(...nums);
        const span = max - min;
        const pad = span === 0 ? Math.max(Math.abs(min) * 0.05, integer ? 1 : 0.05) : span * 0.1;
        let lo = min - pad;
        let hi = max + pad;
        if (integer) {
          lo = Math.floor(lo);
          hi = Math.ceil(hi);
          if (lo === hi) {
            lo -= 1;
            hi += 1;
          }
        }
        if (min >= 0) {
          lo = Math.max(0, lo);
        }
        return [lo, hi];
      }

      function chartLayout(theme, series) {
        const dark = theme === "dark";
        const bg = dark ? "#282828" : "#fff";
        const fg = dark ? "#ebdbb2" : "#3c3836";
        const muted = dark ? "#a89984" : "#665c54";
        const grid = dark ? "#504945" : "#d5c4a1";
        const showTu = hasTranslationUnits(series);
        const tuColor = seriesColors(theme).tus;
        const layout = {
          title: { text: "Build time (ClangBuildAnalyzer)", font: { color: fg, size: 18 } },
          margin: { l: 64, r: showTu ? 72 : 24, t: 56, b: 80 },
          paper_bgcolor: bg,
          plot_bgcolor: bg,
          font: { color: fg },
          legend: {
            orientation: "h",
            x: 0,
            y: -0.18,
            font: { color: fg },
            bgcolor: "rgba(0,0,0,0)",
            borderwidth: 0,
          },
          xaxis: {
            title: { text: "Date (UTC)" },
            type: "date",
            gridcolor: grid,
            zerolinecolor: grid,
            linecolor: muted,
            tickfont: { color: muted },
          },
          yaxis: {
            title: { text: "Time (hours)" },
            gridcolor: grid,
            zerolinecolor: grid,
            linecolor: muted,
            tickfont: { color: muted },
            autorange: false,
            range: paddedRange(
              [].concat(series.parsing_h, series.codegen_h, series.total_h)
            ),
          },
          hovermode: "x unified",
        };
        if (showTu) {
          layout.yaxis2 = {
            title: { text: "Translation units", font: { color: tuColor } },
            overlaying: "y",
            side: "right",
            showgrid: false,
            zerolinecolor: grid,
            linecolor: tuColor,
            tickfont: { color: tuColor },
            tickformat: "d",
            autorange: false,
            range: paddedRange(series.translation_unit_count, true),
          };
        }
        return layout;
      }

      function finiteNumber(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      }

      function toSeries(payload) {
        if (!payload || !Array.isArray(payload.data)) {
          throw new Error("Unexpected dataset shape: missing data[]");
        }
        const rows = payload.data
          .filter((row) => {
            if (!row || typeof row.datetime !== "string") {
              return false;
            }
            return (
              finiteNumber(row.parsing_time_s) !== null &&
              finiteNumber(row.codegen_time_s) !== null &&
              finiteNumber(row.total_time_s) !== null
            );
          })
          .slice()
          .sort((a, b) => a.datetime.localeCompare(b.datetime));
        return {
          x: rows.map((row) => row.datetime),
          parsing_h: rows.map((row) => Number(row.parsing_time_s) / SECONDS_PER_HOUR),
          codegen_h: rows.map((row) => Number(row.codegen_time_s) / SECONDS_PER_HOUR),
          total_h: rows.map((row) => Number(row.total_time_s) / SECONDS_PER_HOUR),
          parsing_s: rows.map((row) => Number(row.parsing_time_s)),
          codegen_s: rows.map((row) => Number(row.codegen_time_s)),
          total_s: rows.map((row) => Number(row.total_time_s)),
          translation_unit_count: rows.map((row) => finiteNumber(row.translation_unit_count)),
        };
      }

      function traces(theme, series) {
        const colors = seriesColors(theme);
        const timeHover = "%{fullData.name}: %{y:.2f} h (%{customdata:.1f} s)<extra></extra>";
        const result = [
          {
            type: "scatter",
            mode: "lines+markers",
            name: "parsing (frontend)",
            x: series.x,
            y: series.parsing_h,
            customdata: series.parsing_s,
            line: { color: colors.parsing, width: 2 },
            marker: { color: colors.parsing, size: 8 },
            hovertemplate: timeHover,
          },
          {
            type: "scatter",
            mode: "lines+markers",
            name: "codegen & opts (backend)",
            x: series.x,
            y: series.codegen_h,
            customdata: series.codegen_s,
            line: { color: colors.codegen, width: 2 },
            marker: { color: colors.codegen, size: 8 },
            hovertemplate: timeHover,
          },
          {
            type: "scatter",
            mode: "lines+markers",
            name: "total",
            x: series.x,
            y: series.total_h,
            customdata: series.total_s,
            line: { color: colors.total, width: 2 },
            marker: { color: colors.total, size: 8 },
            hovertemplate: timeHover,
          },
        ];
        if (hasTranslationUnits(series)) {
          result.push({
            type: "scatter",
            mode: "lines+markers",
            name: "translation units",
            x: series.x,
            y: series.translation_unit_count,
            yaxis: "y2",
            line: { color: colors.tus, width: 2, dash: "dot" },
            marker: { color: colors.tus, size: 8 },
            hovertemplate: "%{fullData.name}: %{y}<extra></extra>",
          });
        }
        return result;
      }

      async function fetchDataset() {
        const errors = [];
        for (const url of DATA_URLS) {
          try {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) {
              throw new Error(`${response.status} ${response.statusText}`);
            }
            return await response.json();
          } catch (err) {
            errors.push(`${url}: ${err.message}`);
          }
        }
        throw new Error(errors.join("; "));
      }

      function setStatus(message) {
        const status = document.getElementById("status");
        if (message) {
          status.textContent = message;
          status.hidden = false;
        } else {
          status.hidden = true;
        }
      }

      async function main() {
        const chart = document.getElementById("chart");
        let theme = parentTheme();
        applyTheme(theme);

        let payload;
        try {
          payload = await fetchDataset();
        } catch (err) {
          setStatus(`Could not load build time history.\n${err.message}`);
          return;
        }

        const series = toSeries(payload);
        if (series.x.length === 0) {
          setStatus("The build time dataset is empty.");
          return;
        }

        await Plotly.newPlot(chart, traces(theme, series), chartLayout(theme, series), {
          responsive: true,
          displaylogo: false,
        });
        setStatus("");
        drawCurvedAnnotations(chart, series);
        chart.on("plotly_afterplot", () => drawCurvedAnnotations(chart, series));

        const restyle = () => {
          theme = parentTheme();
          applyTheme(theme);
          Plotly.react(chart, traces(theme, series), chartLayout(theme, series));
        };

        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyle);

        try {
          if (window.parent && window.parent !== window) {
            const observer = new MutationObserver(restyle);
            observer.observe(window.parent.document.documentElement, {
              attributes: true,
              attributeFilter: ["data-theme"],
            });
          }
        } catch (err) {
          /* Ignore if the parent document is not readable. */
        }
      }

      main();
    </script>
  </body>
</html>
